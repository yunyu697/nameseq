name: Release

# 打 tag（形如 v0.9.0）推送到仓库即自动在三个平台并行构建，并把产物汇总到同一个 GitHub Release：
#   Windows → msi 安装包 + nsis exe 安装包 + 便携 zip
#   macOS   → dmg 安装包（未签名，见下方说明）
#   Linux   → deb + rpm + AppImage + 裸二进制
# 自动更新签名（.sig）每个平台都生成。三个平台构建完只上传 artifact，
# 由最后的 publish job 汇总成**一份多平台 latest.json** 再建 Release ——
# updater 的端点是 releases/latest/download/latest.json，一个文件要同时服务
# 三个平台，各平台各写一份只会互相覆盖，导致 mac/Linux 用户永远收不到更新。
on:
  push:
    tags:
      - "v*.*.*"

# 建 Release / 上传产物需要写权限
permissions:
  contents: write

# 避免同一个 tag 重复触发时互相打架
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # 任一平台失败就取消其余，避免发布半成品
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      # 自动更新签名私钥（仓库 secret，= 本地 .keys/nameseq.key 全文）。
      # Windows 走 release.mjs 时会改成文件路径，其余平台直接用内容。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/renamer-core
            crates/nameseq-cli
            src-tauri

      # Linux 需要一堆系统库才能编译 Tauri；rpm 用来打 rpm 包
      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm libfuse2

      - name: 安装前端依赖
        run: npm ci

      # 取出纯版本号（去掉 tag 前的 v），同步进四个版本文件；
      # 仓库里若已和 tag 一致则是 no-op，否则自动对齐，保证产物命名与 tag 一致。
      - name: 计算版本号
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 对齐版本号到 tag
        run: npm run release ${{ steps.ver.outputs.version }}

      # 发版说明进 latest.json 的 notes，客户端「检查更新」才看得到更新内容。
      # 注解标签（git tag -a -m "…"）用它的消息；轻量标签用版本提交的正文
      # ——注意 `%(contents)` 对轻量标签会回落成提交消息（开头是「发版 x.y.z：
      # 版本号同步」这类工程噪音），所以先用 cat-file 判断标签类型。
      - name: 取发版说明
        id: notes
        shell: bash
        run: |
          # checkout 在 tag 事件下常常只把提交 sha 写进 refs/tags/<name>（轻量 ref），
          # 注解标签对象本身没到本地——cat-file 于是返回 commit，标签消息就丢了。
          # v0.9.3 就这么发出一份空说明，所以这里显式再拉一次真正的标签对象。
          git fetch --force --no-recurse-submodules origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          kind=$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || echo none)
          if [ "$kind" = "tag" ]; then
            msg=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          else
            msg=$(git log -1 --format='%b' "$GITHUB_REF_NAME")
            # 正文也空时退到标题，宁可带点工程噪音也别让更新提示一片空白
            if [ -z "$(printf '%s' "$msg" | tr -d '[:space:]')" ]; then
              msg=$(git log -1 --format='%s' "$GITHUB_REF_NAME")
              echo "::warning::没读到注解标签的消息（cat-file=$kind），退回到提交标题"
            fi
          fi
          # 压成单行：notes 要进 JSON，换行只会让更新提示更难读
          msg=$(printf '%s' "$msg" | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')
          {
            echo 'notes<<__NOTES_EOF__'
            echo "$msg"
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"
          echo "发版说明：${msg:0:80}"

      # 发布前门禁：引擎与命令行单测不过就不构建（挑 Linux 跑，Rust 引擎与平台无关）
      - name: 引擎测试
        if: matrix.platform == 'linux'
        working-directory: crates/renamer-core
        run: cargo test
      - name: 命令行测试
        if: matrix.platform == 'linux'
        working-directory: crates/nameseq-cli
        run: cargo test

      # ---- Windows：复用本地 release 脚本，产出 msi + nsis + 签名 + latest.json ----
      - name: 写入签名私钥文件（Windows）
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p .keys
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > .keys/nameseq.key

      - name: 构建 Windows 安装包 + 更新清单
        if: matrix.platform == 'windows'
        shell: bash
        env:
          NSQ_NOTES: ${{ steps.notes.outputs.notes }}
        run: npm run release ${{ steps.ver.outputs.version }} -- --build --notes "$NSQ_NOTES"

      - name: 打包 Windows 便携 zip
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          VER=${{ steps.ver.outputs.version }}
          tar -a -cf "dist-release/nameseq_${VER}_x64_portable.zip" -C src-tauri/target/release nameseq.exe

      # ---- macOS / Linux：直接 tauri build，按平台产出对应包 ----
      - name: 构建 macOS 包
        if: matrix.platform == 'macos'
        run: npm run tauri build

      - name: 构建 Linux 包（deb + rpm + AppImage）
        if: matrix.platform == 'linux'
        run: npm run tauri build -- --bundles deb,rpm,appimage

      # ---- 收集产物到 release-assets/（不能复用 Vite 的 dist/，否则前端文件会混进 Release）----
      - name: 收集 Windows 产物
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist-release/* release-assets/ 2>/dev/null || true
          # 本地脚本按单平台生成了 latest.json，这里删掉：多平台合并版由 publish job 出
          rm -f release-assets/latest.json

      - name: 收集 macOS 产物
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} release-assets/ \;

      - name: 收集 Linux 产物
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.sig" \) -exec cp {} release-assets/ \;
          cp src-tauri/target/release/nameseq release-assets/nameseq-linux-x64 2>/dev/null || true

      # 只上传 artifact，不建 Release：Release 由 publish job 统一建一次，
      # 否则三个平台会各建/各改同一个 Release，latest.json 谁最后写谁生效。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  # 汇总三个平台的签名，生成唯一一份多平台 latest.json，再建 Release。
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取标签消息要完整历史，浅克隆拿不到
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 三个平台的产物合并到同一个目录（文件名互不冲突）
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 计算版本号
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 取发版说明
        id: notes
        shell: bash
        run: |
          # 同 build job：checkout 可能没带注解标签对象，先显式拉一次
          git fetch --force --no-recurse-submodules origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          kind=$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || echo none)
          if [ "$kind" = "tag" ]; then
            msg=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          else
            msg=$(git log -1 --format='%b' "$GITHUB_REF_NAME")
            if [ -z "$(printf '%s' "$msg" | tr -d '[:space:]')" ]; then
              msg=$(git log -1 --format='%s' "$GITHUB_REF_NAME")
              echo "::warning::没读到注解标签的消息（cat-file=$kind），退回到提交标题"
            fi
          fi
          msg=$(printf '%s' "$msg" | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')
          {
            echo 'notes<<__NOTES_EOF__'
            echo "$msg"
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"
          echo "发版说明：${msg:0:80}"

      - name: 合并生成多平台 latest.json
        shell: bash
        env:
          NSQ_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          ls -1 release-assets
          node scripts/latest.mjs \
            --version "${{ steps.ver.outputs.version }}" \
            --dir release-assets \
            --notes "$NSQ_NOTES" \
            --mac-arch aarch64
          echo "--- 清单内容 ---"
          cat release-assets/latest.json

      - name: 建 Release 并上传全部产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "名序 ${{ github.ref_name }}"
          body: |
            ${{ steps.notes.outputs.notes }}

            ---
            多平台自动构建：Windows（msi / exe / 便携 zip）、macOS（dmg）、Linux（deb / rpm / AppImage / 裸二进制）。
            每个安装包旁边有同名 `.sig` 自动更新签名；`latest.json` 是三平台合并的更新清单。
          draft: false
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
