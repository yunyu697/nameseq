name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    # 产物是 Windows 桌面应用，引擎测试就在 Windows 上跑，和用户环境一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Windows runner 上从零编译要七八分钟，缓存 target 能压到一分钟上下
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/renamer-core
            crates/nameseq-cli
      - name: 引擎测试（扫描 / 规划 / 执行 / 撤销 / 恢复）
        working-directory: crates/renamer-core
        run: cargo test
      - name: 命令行测试（真跑改名与撤销）
        working-directory: crates/nameseq-cli
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 生产构建
        run: npm run build

  ui:
    # 布局测量受字体和滚动条影响，必须在 Windows 上跑才和用户看到的一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI 回归（布局零变形 / 拖拽排序 / 分区折叠 / i18n 完整性）
        shell: bash
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee ui-test.log
      # 日志要登录才能看，把断言原文写进注解，失败原因直接在 PR/提交页可见
      - name: 把失败原因写进注解
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path ui-test.log)) {
            Write-Output "::error::没有生成测试日志"
            exit 0
          }
          $log = Get-Content ui-test.log -Raw
          $blocks = [regex]::Matches($log, '(?s)not ok \d+ - ([^\r\n]+)\r?\n.*?error: \|-?\r?\n(.*?)\r?\n\s+code:')
          $i = 0
          foreach ($b in $blocks) {
            if ($i -ge 4) { break }
            $title = ($b.Groups[1].Value.Trim() -replace '[:\r\n]', ' ')
            $msg = ($b.Groups[2].Value -replace '\r?\n\s*', ' ').Trim()
            if ($msg.Length -gt 600) { $msg = $msg.Substring(0, 600) }
            Write-Output "::error title=$title::$msg"
            $i++
          }
          if ($i -eq 0) {
            $tail = ($log -split "`n" | Select-Object -Last 20) -join " | "
            Write-Output "::error::没解析到断言块，日志尾部：$tail"
          }
