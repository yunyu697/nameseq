name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    # 产物是 Windows 桌面应用，引擎测试就在 Windows 上跑，和用户环境一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Windows runner 上从零编译要七八分钟，缓存 target 能压到一分钟上下
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/renamer-core
            crates/nameseq-cli
      - name: 引擎测试（扫描 / 规划 / 执行 / 撤销 / 恢复）
        working-directory: crates/renamer-core
        run: cargo test
      - name: 命令行测试（真跑改名与撤销）
        working-directory: crates/nameseq-cli
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 前端纯函数测试（路径回写 / 前缀替换边界）
        run: npm run test:unit
      - name: 生产构建
        run: npm run build

  ui:
    # 布局测量受字体和滚动条影响，必须在 Windows 上跑才和用户看到的一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI 回归（布局零变形 / 拖拽排序 / 分区折叠 / i18n 完整性）
        shell: bash
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee ui-test.log
      # 日志要登录才能看，把断言原文写进注解，失败原因直接在 PR/提交页可见。
      # 不依赖固定的 TAP 版式：先把所有 `not ok` 用例名找出来（保证一定能定位到是谁），
      # 再把该用例后面那一段里的 error 内容提出来（单行 error: '…' 和 error: |- 块都吃）
      - name: 把失败原因写进注解
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path ui-test.log)) {
            Write-Output "::error::没有生成测试日志"
            exit 0
          }
          $log = Get-Content ui-test.log -Raw
          $fails = [regex]::Matches($log, '(?m)^not ok \d+ - (.+)$')
          if ($fails.Count -eq 0) {
            $tail = ($log -split "`n" | Select-Object -Last 25) -join " | "
            Write-Output "::error::日志里没有 not ok 行，尾部：$tail"
            exit 0
          }
          $i = 0
          foreach ($m in $fails) {
            if ($i -ge 4) { break }
            $title = ($m.Groups[1].Value.Trim() -replace '[:\r\n]', ' ')
            # 从这条 not ok 开始截一段，到下一个 not ok 之前（够长就截 2000 字符）
            $rest = $log.Substring($m.Index)
            $next = $rest.IndexOf("`nnot ok", 1)
            $block = if ($next -gt 0) { $rest.Substring(0, $next) } else { $rest }
            if ($block.Length -gt 2000) { $block = $block.Substring(0, 2000) }
            # 去掉 TAP 的样板行，只留错误正文和位置
            $lines = ($block -split "`r?`n") | Where-Object {
              $_ -notmatch '^\s*(---|\.\.\.|duration_ms:|type:|code:|failureType:|stack:|\.\.\.)\s*$' -and
              $_ -notmatch '^\s*(code|failureType|stack):'
            }
            $msg = (($lines -join ' ') -replace '\s+', ' ').Trim()
            if ($msg.Length -gt 700) { $msg = $msg.Substring(0, 700) }
            Write-Output "::error title=$title::$msg"
            $i++
          }
