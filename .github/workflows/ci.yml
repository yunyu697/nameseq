name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    # 产物是 Windows 桌面应用，引擎测试就在 Windows 上跑，和用户环境一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Windows runner 上从零编译要七八分钟，缓存 target 能压到一分钟上下
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/renamer-core
            crates/nameseq-cli
      - name: 引擎测试（扫描 / 规划 / 执行 / 撤销 / 恢复）
        working-directory: crates/renamer-core
        run: cargo test
      - name: 命令行测试（真跑改名与撤销）
        working-directory: crates/nameseq-cli
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 生产构建
        run: npm run build

  ui:
    # 布局测量受字体和滚动条影响，必须在 Windows 上跑才和用户看到的一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI 回归（布局零变形 / 拖拽排序 / 分区折叠 / i18n 完整性）
        run: npm run test:ui
